# Agones Helm values — adapted from the 云 sample.
#
# Key change vs. the 云 source: the allocator Service no longer relies on the
# 云 Load Balancer Controller + NLB. On CCE we express the same intent with
# Service annotations that drive an ELB (performance/shared) automatically:
#   - kubernetes.io/elb.class        : performance ELB (Layer 4, like NLB)
#   - kubernetes.io/elb.subnet-id    : subnet the ELB is created in
#   - kubernetes.io/elb.scheme       : internet-facing allocator endpoint
#   - kubernetes.io/elb.pass-through : "true" preserves the real client IP
#                                      (replaces 云 target-group
#                                       preserve_client_ip.enabled=true)
# See https://support.huaweicloud.com/usermanual-cce/cce_10_0063.html
agones:
  metrics:
    prometheusEnabled: true
    prometheusServiceDiscovery: true
  controller:
    logLevel: warn
    resources:
      requests:
        cpu: 400m
        memory: 256Mi
    nodeSelector:
      "agones.dev/agones-system": "true"
  # Install this if you need ping service https://agones.dev/site/docs/guides/ping-service/
  ping:
    install: false
  allocator:
    # Currently we have a lot of invalid warnings when logLevel is below warn
    # https://github.com/googleforgames/agones/issues/2498
    logLevel: error
    resources:
      requests:
        cpu: 400m
        memory: 256Mi
    replicas: null
    nodeSelector:
      "agones.dev/agones-system": "true"
    service:
      # Restrict which CIDRs may reach the allocator LoadBalancer Service.
      loadBalancerSourceRanges:
%{ for cidr in allocator_allowed_cidrs ~}
        - ${cidr}
%{ endfor ~}

      annotations:
        # Deploy a performance ELB (Layer 4) instead of a CLB.
        kubernetes.io/elb.class: performance

        # ELB is placed in the cluster's subnet.
        kubernetes.io/elb.subnet-id: ${subnet_id}

        # Set to "internal" if you do not need internet access.
        kubernetes.io/elb.scheme: internet

        # Pass-through preserves the real client IP at the allocator (equivalent
        # to 云 NLB target-group preserve_client_ip.enabled=true).
        kubernetes.io/elb.pass-through: "true"

        # ELB idle timeout (seconds) — keep allocator gRPC streams alive.
        kubernetes.io/elb.idle-timeout: "30"

      # Enabled this if you need REST api service
      http:
        enabled: true
    # TLS certificates for allocator service will be generated by cert-manager
    # because Helm-generated certs has invalid CN.
    generateTLS: false
    # TLS certificate for allocator service clients will also be generated by cert-manager
    # because otherwise certs are updated every time we update Helm chart.
    generateClientTLS: false

gameservers:
  namespaces:
  - ${gameserver_namespace}
