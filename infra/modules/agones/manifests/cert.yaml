# Issue mTLS certificates for allocator service and its client using cert-manager
# https://cert-manager.io/docs/usage/certificate/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: allocator-tls-org
  namespace: ${namespace}
spec:
  # Set dnsName as ELB domain name. The CCE ELB address is
  # "<id>.elb.<region>.myhuaweicloud.com"; a wildcard keeps the self-signed
  # server cert valid across allocator endpoints.
  dnsNames:
    - "*.elb.${region}.myhuaweicloud.com"
  secretName: allocator-tls-org
  commonName: allocation-ca
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  duration: 87600h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: allocator-client-tls
  namespace: ${namespace}
spec:
  # You can use arbitrary CN for a client certificate.
  commonName: allocation-ca
  secretName: allocator-client-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  duration: 87600h
---
